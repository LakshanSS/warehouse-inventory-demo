# GitOps Workflow Run for Inventory API GitOps Component
# Uses the same source code as inventory-api but deployed via GitOps flow
#
# Prerequisites:
#   1. Install workflow: kubectl apply -f samples/gitops-workflows/component-workflows/build-and-release/docker/
#   2. Configure tokens in ClusterSecretStore (git-token, gitops-token)
#   3. Create Component: kubectl apply -f demo/.openchoreo/inventory-api-gitops.yaml
#
# Usage:
#   kubectl apply -f demo/gitops/inventory-api-gitops-run.yaml
#
# To re-run: increment the name (e.g., inventory-api-gitops-release-002)

apiVersion: openchoreo.dev/v1alpha1
kind: ComponentWorkflowRun
metadata:
  name: inventory-api-gitops-release-001
  namespace: default
spec:
  owner:
    projectName: "default"
    componentName: "inventory-api-gitops"
  workflow:
    name: docker-gitops-release
    systemParameters:
      repository:
        url: "https://github.com/LakshanSS/warehouse-inventory-demo"
        revision:
          branch: "main"
        appPath: "/inventory-api"
    parameters:
      docker:
        context: "/inventory-api"
        filePath: "/inventory-api/Dockerfile"
      gitops:
        repositoryUrl: "https://github.com/LakshanSS/warehouse-inventory-gitops"
        branch: "main"
        targetEnvironment: "development"
        deploymentPipeline: "simple-pipeline"
      workloadDescriptorPath: "workload.yaml"
