apiVersion: openchoreo.dev/v1alpha1

metadata:
  name: inventory-api

endpoints:
  - name: inventory-api
    port: 9090
    type: REST
    schemaFile: docs/openapi.yaml

configurations:
  env:
    - name: ENVIRONMENT
      value: production
    - name: DB_SERVER
      valueFrom:
        secretRef:
          name: inventory-db-server
          key: value
    - name: DB_PORT
      valueFrom:
        secretRef:
          name: inventory-db-port
          key: value
    - name: DB_USER
      valueFrom:
        secretRef:
          name: inventory-db-user
          key: value
    - name: DB_PASSWORD
      valueFrom:
        secretRef:
          name: inventory-db-password
          key: value
    - name:: DB_NAME
      valueFrom:
        secretRef:
          name: inventory-db-name
          key: value
