# Component definition for inventory-dashboard-gitops
# This component uses the same source as inventory-dashboard but is deployed via GitOps
# Note: No autoDeploy or workflow section - deployment is handled via GitOps PRs

apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: inventory-dashboard-gitops
spec:
  owner:
    projectName: default
  componentType: deployment/web-application
  parameters:
    exposed: true
    replicas: 1
    port: 3000
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    livenessProbe:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 15
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /
        port: 3000
      initialDelaySeconds: 10
      periodSeconds: 10
