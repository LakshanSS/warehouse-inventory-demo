# OpenChoreo Component Configuration - Inventory API
# Go backend service for warehouse inventory management

apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: inventory-api
spec:
  owner:
    projectName: default
  componentType: deployment/service
  autoDeploy: true
  workflow:
    name: docker
    systemParameters:
      repository:
        url: "https://github.com/lakshanss/warehouse-inventory-demo"
        revision:
          branch: "main"
        appPath: "/inventory-api"
    parameters:
      docker:
        context: "/inventory-api"
        filePath: "/inventory-api/Dockerfile"
  parameters:
    exposed: true
    replicas: 1
    port: 9090
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      - name: ENVIRONMENT
        value: "production"
      - name: DB_SERVER
        valueFrom:
          secretKeyRef:
            name: inventory-db-credentials
            key: server
      - name: DB_PORT
        valueFrom:
          secretKeyRef:
            name: inventory-db-credentials
            key: port
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: inventory-db-credentials
            key: username
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: inventory-db-credentials
            key: password
      - name: DB_NAME
        valueFrom:
          secretKeyRef:
            name: inventory-db-credentials
            key: database
    livenessProbe:
      httpGet:
        path: /health
        port: 9090
      initialDelaySeconds: 10
      periodSeconds: 30
    readinessProbe:
      httpGet:
        path: /health
        port: 9090
      initialDelaySeconds: 5
      periodSeconds: 10

---
apiVersion: openchoreo.dev/v1alpha1
kind: ComponentWorkflowRun
metadata:
  name: inventory-api-build-01
spec:
  owner:
    projectName: "default"
    componentName: "inventory-api"
  workflow:
    name: docker
    systemParameters:
      repository:
        url: "https://github.com/lakshanss/warehouse-inventory-demo"
        revision:
          branch: "main"
        appPath: "/inventory-api"
    parameters:
      docker:
        context: "/inventory-api"
        filePath: "/inventory-api/Dockerfile"
