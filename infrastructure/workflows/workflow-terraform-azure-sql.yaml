# OpenChoreo Workflow for Azure SQL Database Provisioning
# This defines the parameter schema and maps to the ClusterWorkflowTemplate
#
# Usage:
#   1. Install: kubectl apply -f workflow-terraform-azure-sql.yaml
#   2. Trigger: kubectl apply -f workflow-run-provision-inventory-db.yaml

apiVersion: openchoreo.dev/v1alpha1
kind: Workflow
metadata:
  name: provision-azure-sql-database
  namespace: default
  labels:
    category: infrastructure
    provider: azure
    resource-type: database
spec:
  # ==========================================================================
  # Parameter Schema
  # Uses compact string format: type | default=value description="..."
  # ==========================================================================
  schema:
    parameters:
      # Source repository containing Terraform configs
      repository:
        url: string | default=https://github.com/LakshanSS/warehouse-inventory-demo description="Git repository URL containing Terraform configurations"
        branch: string | default=main description="Git branch to use"
        terraformPath: string | default=/demo/infrastructure/terraform/azure-sql description="Path to Terraform configs within the repository"

      # Azure resource configuration
      azure:
        resourceGroup: string | description="Azure Resource Group name (must exist)"
        location: string | default=eastus description="Azure region for resources"

      # Database configuration
      database:
        serverName: string | description="SQL Server name (must be globally unique in Azure)"
        name: string | description="Database name"
        sku: string | default=Basic description="Database SKU/pricing tier"

      # Output configuration
      output:
        secretNamespace: string | default=default description="Namespace for the output connection secret"

  # ==========================================================================
  # Run Template
  # Generates the Argo Workflow when a WorkflowRun is created
  # ==========================================================================
  runTemplate:
    apiVersion: argoproj.io/v1alpha1
    kind: Workflow
    metadata:
      name: ${metadata.workflowRunName}
      namespace: openchoreo-ci-${metadata.orgName}
    spec:
      serviceAccountName: workflow-sa
      arguments:
        parameters:
          # Repository parameters
          - name: git-repo
            value: ${parameters.repository.url}
          - name: git-branch
            value: ${parameters.repository.branch}
          - name: terraform-path
            value: ${parameters.repository.terraformPath}
          # Azure parameters
          - name: resource-group
            value: ${parameters.azure.resourceGroup}
          - name: location
            value: ${parameters.azure.location}
          # Database parameters
          - name: server-name
            value: ${parameters.database.serverName}
          - name: database-name
            value: ${parameters.database.name}
          - name: database-sku
            value: ${parameters.database.sku}
          # Output parameters
          - name: output-secret-namespace
            value: ${parameters.output.secretNamespace}
      workflowTemplateRef:
        clusterScope: true
        name: terraform-azure-sql
